<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Frontend GraphQL + MySQL (Full CRUD)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 680px; margin: 30px auto; padding: 20px; line-height: 1.6; color: #334155; }
    h1 { color: #1e293b; margin-bottom: 4px; }
    .badge { display: inline-block; background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; margin-bottom: 16px; }
    
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .card-info { flex: 1; }
    .title { font-weight: bold; font-size: 1.05em; color: #0f172a; }
    .author { color: #64748b; font-size: 0.9em; margin-top: 3px; }
    .card-actions { display: flex; gap: 6px; }
    
    .grid-forms { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
    @media (max-width: 640px) { .grid-forms { grid-template-columns: 1fr; } }

    .form-box { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 16px; }
    .form-box h3 { margin-top: 0; font-size: 1em; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 6px; }
    .form-group { margin-bottom: 10px; }
    label { display: block; font-weight: 600; font-size: 0.82em; margin-bottom: 3px; color: #475569; }
    input, select { width: 100%; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 13.5px; }
    
    .search-bar { width: 100%; padding: 9px 12px; border: 2px solid #6366f1; border-radius: 6px; margin-bottom: 14px; box-sizing: border-box; font-size: 14px; }
    
    button { background: #4f46e5; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    button:hover { background: #4338ca; }
    .btn-danger { background: #ef4444; padding: 5px 10px; font-size: 12px; }
    .btn-danger:hover { background: #dc2626; }
    .btn-edit { background: #f59e0b; padding: 5px 10px; font-size: 12px; }
    .btn-edit:hover { background: #d97706; }
    .btn-refresh { background: #64748b; margin-bottom: 12px; font-size: 12px; padding: 6px 12px; }
  </style>
</head>
<body>

  <h1>📚 Katalog Buku (Spring Boot + MySQL)</h1>
  <span class="badge">Live MySQL Database (graphql) - Tanpa Seeder</span>
  <p>Seluruh data disimpan dan diambil langsung dari database MySQL via GraphQL Query & Mutation.</p>

  <div class="grid-forms">
    <!-- FORM 1: BUAT PENULIS (CREATE AUTHOR) -->
    <div class="form-box">
      <h3>1️⃣ Tambah Penulis Baru</h3>
      <form id="form-author" onsubmit="tambahPenulis(event)">
        <div class="form-group">
          <label>Nama Penulis:</label>
          <input type="text" id="input-author-name" placeholder="contoh: Tere Liye" required>
        </div>
        <button type="submit">➕ Simpan Penulis</button>
      </form>
    </div>

    <!-- FORM 2: BUAT BUKU (CREATE BOOK) -->
    <div class="form-box">
      <h3>2️⃣ Tambah Buku Baru</h3>
      <form id="form-buku" onsubmit="tambahBuku(event)">
        <div class="form-group">
          <label>Judul Buku:</label>
          <input type="text" id="input-title" placeholder="contoh: Hujan" required>
        </div>
        <div class="form-group">
          <label>Tahun Rilis:</label>
          <input type="number" id="input-year" placeholder="contoh: 2016" required>
        </div>
        <div class="form-group">
          <label>Pilih Penulis:</label>
          <select id="select-author" required>
            <option value="">-- Muat Penulis Dulu --</option>
          </select>
        </div>
        <button type="submit">➕ Simpan Buku</button>
      </form>
    </div>
  </div>

  <!-- AREA BACA DATA (QUERY) -->
  <h3>📖 Data Buku di MySQL (Query)</h3>
  <input 
    type="text" 
    class="search-bar" 
    placeholder="🔍 Cari judul buku di MySQL..." 
    oninput="cariBuku(this.value)"
  >

  <div id="daftar-buku">
    <i>Memuat data dari MySQL...</i>
  </div>

  <script>
    const GRAPHQL_URL = 'http://localhost:8080/graphql';

    // Helper kirim request GraphQL
    async function callGraphQL(query, variables = {}) {
      const res = await fetch(GRAPHQL_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables })
      });
      return await res.json();
    }

    // 1. QUERY: Muat Daftar Penulis ke Dropdown
    async function muatDropdownPenulis() {
      const select = document.getElementById('select-author');
      const query = `query { authors { id name } }`;

      try {
        const res = await callGraphQL(query);
        const authors = res.data?.authors || [];
        
        if (authors.length === 0) {
          select.innerHTML = '<option value="">(Belum ada penulis di MySQL, buat di samping)</option>';
        } else {
          select.innerHTML = '<option value="">-- Pilih Penulis --</option>' + 
            authors.map(a => `<option value="${a.id}">${a.name} (ID: ${a.id})</option>`).join('');
        }
      } catch (err) {
        select.innerHTML = '<option value="">(Gagal memuat penulis - pastikan backend aktif)</option>';
      }
    }

    // 2. QUERY: Muat Daftar Buku
    async function muatDaftarBuku(kataKunci = "") {
      const container = document.getElementById('daftar-buku');
      const query = `
        query AmbilSemua($search: String) {
          books(search: $search) {
            id
            title
            year
            author {
              id
              name
            }
          }
        }
      `;

      try {
        const res = await callGraphQL(query, { search: kataKunci || null });
        const books = res.data?.books || [];

        if (books.length === 0) {
          container.innerHTML = '<p><i>Database MySQL masih kosong. Silakan tambah Penulis lalu tambah Buku di atas!</i></p>';
          return;
        }

        container.innerHTML = books.map(b => `
          <div class="card">
            <div class="card-info">
              <div class="title">📖 ${b.title} (${b.year})</div>
              <div class="author">Penulis: <strong>${b.author ? b.author.name : '-'}</strong> | ID Buku: ${b.id}</div>
            </div>
            <div class="card-actions">
              <button class="btn-edit" onclick="editBuku('${b.id}', '${b.title}', ${b.year})">✏️ Edit</button>
              <button class="btn-danger" onclick="hapusBuku('${b.id}')">🗑️ Hapus</button>
            </div>
          </div>
        `).join('');

      } catch (err) {
        container.innerHTML = '<p style="color:red">Gagal terhubung ke Spring Boot di <code>http://localhost:8080/graphql</code>.<br>Pastikan aplikasi sudah dijalankan dengan <code>mvn spring-boot:run</code>.</p>';
      }
    }

    // 3. MUTATION: Tambah Penulis
    async function tambahPenulis(e) {
      e.preventDefault();
      const name = document.getElementById('input-author-name').value;
      const mutation = `
        mutation BuatPenulis($name: String!) {
          createAuthor(name: $name) {
            id
            name
          }
        }
      `;

      const res = await callGraphQL(mutation, { name });
      if (res.data?.createAuthor) {
        alert(`Penulis "${res.data.createAuthor.name}" berhasil disimpan ke MySQL!`);
        document.getElementById('form-author').reset();
        muatDropdownPenulis();
      } else {
        const pesanError = res.errors ? res.errors[0].message : 'Terjadi kesalahan';
        alert('Gagal menambah penulis: ' + pesanError);
      }
    }

    // 4. MUTATION: Tambah Buku
    async function tambahBuku(e) {
      e.preventDefault();
      const title = document.getElementById('input-title').value;
      const year = parseInt(document.getElementById('input-year').value, 10);
      const authorId = document.getElementById('select-author').value;

      if (!authorId) {
        alert('Pilih penulis terlebih dahulu!');
        return;
      }

      const mutation = `
        mutation BuatBuku($title: String!, $year: Int!, $authorId: ID!) {
          createBook(title: $title, year: $year, authorId: $authorId) {
            id
            title
            year
          }
        }
      `;

      const res = await callGraphQL(mutation, { title, year, authorId });
      if (res.data?.createBook) {
        alert(`Buku "${res.data.createBook.title}" berhasil disimpan ke MySQL!`);
        document.getElementById('form-buku').reset();
        muatDaftarBuku();
      } else {
        const pesanError = res.errors ? res.errors[0].message : 'Terjadi kesalahan';
        alert('Gagal menambah buku: ' + pesanError);
      }
    }

    // 5. MUTATION: Edit Buku (Update)
    async function editBuku(id, oldTitle, oldYear) {
      const newTitle = prompt('Judul Baru:', oldTitle);
      if (newTitle === null) return;
      
      const newYearStr = prompt('Tahun Rilis Baru:', oldYear);
      if (newYearStr === null) return;
      const newYear = parseInt(newYearStr, 10);

      const mutation = `
        mutation UbahBuku($id: ID!, $title: String, $year: Int) {
          updateBook(id: $id, title: $title, year: $year) {
            id
            title
            year
          }
        }
      `;

      const res = await callGraphQL(mutation, { id, title: newTitle, year: newYear });
      if (res.data?.updateBook) {
        alert('Data buku berhasil diperbarui di MySQL!');
        muatDaftarBuku();
      } else {
        const pesanError = res.errors ? res.errors[0].message : 'Terjadi kesalahan';
        alert('Gagal update: ' + pesanError);
      }
    }

    // 6. MUTATION: Hapus Buku (Delete)
    async function hapusBuku(id) {
      if (!confirm('Yakin ingin menghapus buku ini dari database MySQL?')) return;

      const mutation = `
        mutation HapusBuku($id: ID!) {
          deleteBook(id: $id)
        }
      `;

      const res = await callGraphQL(mutation, { id });
      if (res.data?.deleteBook) {
        alert('Buku berhasil dihapus dari database MySQL!');
        muatDaftarBuku();
      } else {
        const pesanError = res.errors ? res.errors[0].message : 'Gagal menghapus buku.';
        alert('Gagal menghapus buku: ' + pesanError);
      }
    }

    // Debounce cari
    let timerCari = null;
    function cariBuku(val) {
      clearTimeout(timerCari);
      timerCari = setTimeout(() => muatDaftarBuku(val), 300);
    }

    // Inisialisasi awal
    muatDropdownPenulis();
    muatDaftarBuku();
  </script>
</body>
</html>
