# Port server Spring Boot
server.port=8080

# ==========================================
# MySQL Configuration (Provided by User)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/graphql?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=bintangmada
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# GraphQL Configuration
# ==========================================
# Aktifkan antarmuka visual GraphiQL di browser (http://localhost:8080/graphiql)
spring.graphql.graphiql.enabled=true

# Izinkan akses CORS dari frontend HTML
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
